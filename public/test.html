<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Icon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div>
    <!-- Chatbot Icon with message box -->
    <a href="#" class="chatbot-icon" onclick="openChatbot()">
      <div class="chatbot-message-box">
        <span>Ask about us...</span>
      </div>
      <img src="/image/bot.png" alt="Chatbot Icon">
    </a>
  </div>

  <!-- Chatbot container that will be shown when clicked -->
  <div id="chatbot-container" style="display: none;">
    <div id="chatbot-header">
      <button id="close-chatbot" onclick="closeChatbot()">Back</button>
    </div>
    <!-- Chatbot Iframe -->
    <iframe id="chatbot-iframe" src="https://cdn.botpress.cloud/webchat/v2.2/shareable.html?configUrl=https://files.bpcontent.cloud/2024/11/28/07/20241128070652-JN2HCR7N.json" 
            style="width: 400px; height: 600px; border: none;">
    </iframe>
  </div>

  <style>
    /* Chatbot icon styles */
    .chatbot-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007bff;
      padding: 10px;
      border-radius: 50%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .chatbot-icon img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Chatbot message box styles */
    .chatbot-message-box {
      position: absolute;
      top: -35px;
      background-color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-size: 16px;
      color: #007bff;
      width: 120px;
      text-align: center;
      font-weight: bold;
      display: block; 
      margin-left: -70px;/* Always visible */
      margin-top: -10px;
    }

    .chatbot-icon:hover .chatbot-message-box {
      display: block; /* Ensure message box is visible all the time */
    }

    .chatbot-icon:hover {
      background-color: #0056b3;
      transform: scale(1.1);
    }

    /* Chatbot container styles */
    #chatbot-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: none; /* Hidden by default */
      z-index: 1000;
    }

    #chatbot-header {
      text-align: right;
    }

    #close-chatbot {
      background-color: #f44336;
      color: #fff;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 14px;
    }

    #close-chatbot:hover {
      background-color: #d32f2f;
    }

    /* Hide content when chatbot is opened */
    #content {
      transition: opacity 0.5s ease;
    }

    /* Styles to hide content when chatbot is active */
    .hide-content #content {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script>
    function openChatbot() {
      // Hide main content and show the chatbot container
      document.body.classList.add('hide-content');
      document.getElementById('chatbot-container').style.display = 'block';
    }

    function closeChatbot() {
      // Hide the chatbot and show main content again
      document.body.classList.remove('hide-content');
      document.getElementById('chatbot-container').style.display = 'none';
    }
  </script>

</body>
</html>
